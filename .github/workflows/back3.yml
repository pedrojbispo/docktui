name: Backup Repositories to CGP Cloud Storage.

on: 
  push:
  workflow_dispatch:

jobs:
  back-up:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        repo_name:
          [
            "lab02_A035242"
          ]
        include:
          - repo_name: "lab02_A035242"
            repo_url: "https://__PAT_TOKEN__@github.com/BDCC-2026/lab02_A035242.git"
        

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ">=26"
          check-latest: true

      - name: Install @larose/git-backup
        run: npm install -g @larose/git-backup

      - name: Back up ${{ matrix.repo_name }}
        env:
          SECRET_PAT: ${{ secrets.PAT }}
        run: |
          FINAL_REPO_URL=$(echo "${{ matrix.repo_url }}" | sed "s|__PAT_TOKEN__|$SECRET_PAT|")
          git-backup snapshot \
            --repo $FINAL_REPO_URL \
            --remote ${{ secrets.REMOTE }}/${{ matrix.repo_name }} \
            --access-key-id ${{ secrets.ACCESS_KEY_ID }} \
            --secret-access-key ${{ secrets.SECRET_ACCESS_KEY }}

          git-backup prune \
            --repo $FINAL_REPO_URL \
            --remote ${{ secrets.REMOTE }}/${{ matrix.repo_name }} \
            --access-key-id ${{ secrets.ACCESS_KEY_ID }} \
            --secret-access-key ${{ secrets.SECRET_ACCESS_KEY }} \
            --retention-policy "daily=7, weekly=4, monthly=3"
